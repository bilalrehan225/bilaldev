<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .cont {
            background-color: white;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            text-align: center;
            border-top: 5px solid #00adb5;
        }

        .head1 {
            font-weight: 700;
            font-size: 28px;
            color: #222831;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .head2 {
            font-weight: 400;
            font-size: 16px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0px 4px 10px rgba(0, 173, 181, 0.3);
        }

        .btn:hover {
            background-color: #00888f;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="cont">
        <div class="head1">THANK YOU!</div>
        <p class="head2">Your details have been successfully sent. I will get back to you soon! 😁</p>
        <a href="index.html" class="btn">GO BACK HOME</a>
    </div>

</body>
</html>
